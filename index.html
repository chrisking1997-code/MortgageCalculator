                'calc-tw-grace-payment': 'Payment During Grace Period',

        // Utilities
        function getLang() {
            return document.getElementById('language-selector').value;
        }

        function t(key) {
            return i18n[getLang()][key] || key;
        }

        function formatCurrency(amount, locale, currency) {
            return new Intl.NumberFormat(locale, { style: 'currency', currency: currency, maximumFractionDigits: 0 }).format(amount);
        }

        function formatNumberWithCommas(value) {
            // Remove non-digit characters
            const num = value.replace(/\D/g, "");
            // Format with commas
            return num.replace(/\B(?=(\d{3})+(?!\d))/g, ",");
        }

        function getNumericValue(elementId) {
            const val = document.getElementById(elementId).value.replace(/\D/g, "");
            return parseFloat(val) || 0;
        }

        function createResultCard(title, value, colorClass) {
            return `
                <div class="p-4 ${colorClass} rounded-lg border">
                    <h3 class="text-sm font-medium opacity-80">${title}</h3>
                    <p class="text-xl lg:text-2xl font-bold mt-1">${value}</p>
                </div>
            `;
        }

        function renderAmortization(schedule, locale, currency) {
            const tbody = document.getElementById('amortization-schedule');
            tbody.innerHTML = '';

            const rowsToShow = Math.min(12, schedule.length);
            for (let i = 0; i < rowsToShow; i++) {
                const item = schedule[i];
                const row = document.createElement('tr');
                row.className = i % 2 === 0 ? 'bg-gray-50' : 'bg-white';
                row.innerHTML = `
                    <td class="px-4 py-2 border-t">${item.period}</td>
                    <td class="px-4 py-2 border-t text-primary font-medium">${formatCurrency(item.payment, locale, currency)}</td>
                    <td class="px-4 py-2 border-t">${formatCurrency(item.principal, locale, currency)}</td>
                    <td class="px-4 py-2 border-t">${formatCurrency(item.interest, locale, currency)}</td>
                    <td class="px-4 py-2 border-t text-gray-600">${formatCurrency(item.balance, locale, currency)}</td>
                `;
                tbody.appendChild(row);
            }
        }

        // Calculation Modules
        const Calculators = {
            tw: function() {
                const loanAmount = getNumericValue('tw-loan-amount');
                const annualInterestRate = parseFloat(document.getElementById('tw-interest-rate').value) || 0;
                const loanTermYears = parseInt(document.getElementById('tw-loan-term').value) || 0;
                const gracePeriodYears = parseInt(document.getElementById('tw-grace-period').value) || 0;

                const monthlyInterestRate = (annualInterestRate / 100) / 12;
                const totalPayments = loanTermYears * 12;
                const gracePayments = gracePeriodYears * 12;
                const amortizedPayments = totalPayments - gracePayments;

                let schedule = [];
                let balance = loanAmount;
                let totalInterest = 0;

                let gracePayment = 0;
                if (gracePayments > 0) {
                    gracePayment = balance * monthlyInterestRate;
                }

                let standardPayment = 0;
                if (amortizedPayments > 0) {
                    if (monthlyInterestRate === 0) {
                        standardPayment = balance / amortizedPayments;
                    } else {
                        standardPayment = balance * (monthlyInterestRate * Math.pow(1 + monthlyInterestRate, amortizedPayments)) / (Math.pow(1 + monthlyInterestRate, amortizedPayments) - 1);
                    }
                }

                for (let i = 1; i <= totalPayments; i++) {
                    let interestPayment = balance * monthlyInterestRate;
                    let principalPayment = 0;
                    let payment = 0;

                    if (i <= gracePayments) {
                        payment = interestPayment;
                    } else {
                        payment = standardPayment;
                        principalPayment = payment - interestPayment;
                    }

                    // Adjust last payment
                    if (i === totalPayments) {
                        principalPayment = balance;
                        payment = principalPayment + interestPayment;
                    }

                    balance -= principalPayment;
                    if (balance < 0) balance = 0;

                    totalInterest += interestPayment;

                    schedule.push({
                        period: i,
                        payment: payment,
                        principal: principalPayment,
                        interest: interestPayment,
                        balance: balance
                    });
                }

                const locale = 'zh-TW';
                const currency = 'TWD';

                let resultsHtml = '';
                if (gracePayments > 0) {
                    resultsHtml += createResultCard(t('calc-tw-grace-payment'), formatCurrency(gracePayment, locale, currency), 'bg-blue-50 border-blue-100 text-blue-900');
                    resultsHtml += createResultCard(t('calc-tw-after-payment'), formatCurrency(standardPayment, locale, currency), 'bg-indigo-50 border-indigo-100 text-indigo-900');
                } else {
                    resultsHtml += createResultCard(t('calc-tw-monthly'), formatCurrency(standardPayment, locale, currency), 'bg-blue-50 border-blue-100 text-blue-900');
                }
                resultsHtml += createResultCard(t('calc-total-interest'), formatCurrency(totalInterest, locale, currency), 'bg-green-50 border-green-100 text-green-900');

                document.getElementById('results-container').innerHTML = resultsHtml;
                renderAmortization(schedule, locale, currency);
            },

            us: function() {
                const loanAmount = getNumericValue('us-loan-amount');
                const annualInterestRate = parseFloat(document.getElementById('us-interest-rate').value) || 0;
                const loanTermYears = parseInt(document.getElementById('us-loan-term').value) || 0;
                const extraPayment = getNumericValue('us-extra-payment');

                const monthlyInterestRate = (annualInterestRate / 100) / 12;
                const totalPayments = loanTermYears * 12;

                let standardPayment = 0;
                if (monthlyInterestRate === 0) {
                    standardPayment = loanAmount / totalPayments;
                } else {
                    standardPayment = loanAmount * (monthlyInterestRate * Math.pow(1 + monthlyInterestRate, totalPayments)) / (Math.pow(1 + monthlyInterestRate, totalPayments) - 1);
                }

                // Calculate original totals without extra payment
                const originalTotalInterest = (standardPayment * totalPayments) - loanAmount;

                // Calculate with extra payments
                let schedule = [];
                let balance = loanAmount;
                let actualTotalInterest = 0;
                let actualPaymentsCount = 0;

                while (balance > 0.01 && actualPaymentsCount < totalPayments * 2) { // safety limit
                    actualPaymentsCount++;
                    let interestPayment = balance * monthlyInterestRate;
                    let principalPayment = standardPayment - interestPayment + extraPayment;
                    let payment = standardPayment + extraPayment;

                    if (balance < principalPayment) {
                        principalPayment = balance;
                        payment = principalPayment + interestPayment;
                    }

                    balance -= principalPayment;
                    if (balance < 0) balance = 0;
                    actualTotalInterest += interestPayment;

                    schedule.push({
                        period: actualPaymentsCount,
                        payment: payment,
                        principal: principalPayment,
                        interest: interestPayment,
                        balance: balance
                    });
                }

                const interestSaved = originalTotalInterest - actualTotalInterest;
                const monthsSaved = totalPayments - actualPaymentsCount;

                const locale = 'en-US';
                const currency = 'USD';

                let resultsHtml = createResultCard(t('calc-us-actual-monthly'), formatCurrency(standardPayment + extraPayment, locale, currency), 'bg-blue-50 border-blue-100 text-blue-900');
                resultsHtml += createResultCard(t('calc-us-original-interest'), formatCurrency(originalTotalInterest, locale, currency), 'bg-gray-50 border-gray-200 text-gray-800');

                if (extraPayment > 0) {
                    resultsHtml += createResultCard(t('calc-us-saved-interest'), formatCurrency(interestSaved > 0 ? interestSaved : 0, locale, currency), 'bg-green-50 border-green-100 text-green-900');
                    resultsHtml += createResultCard(t('calc-us-early-payoff'), `${monthsSaved} ${t('calc-us-months')}`, 'bg-yellow-50 border-yellow-100 text-yellow-900');
                }

                document.getElementById('results-container').innerHTML = resultsHtml;
                renderAmortization(schedule, locale, currency);
            },

            uk: function() {
                const loanAmount = getNumericValue('uk-loan-amount');
                const loanTermYears = parseInt(document.getElementById('uk-loan-term').value) || 0;
                const introTermYears = parseInt(document.getElementById('uk-intro-term').value) || 0;
                const introRate = parseFloat(document.getElementById('uk-intro-rate').value) || 0;
                const svrRate = parseFloat(document.getElementById('uk-svr-rate').value) || 0;

                const totalPayments = loanTermYears * 12;
                const introPayments = Math.min(introTermYears * 12, totalPayments);
                const svrPayments = totalPayments - introPayments;

                const introMonthlyRate = (introRate / 100) / 12;
                const svrMonthlyRate = (svrRate / 100) / 12;

                let schedule = [];
                let balance = loanAmount;
                let totalInterest = 0;

                // Phase 1: Intro Rate Calculation
                let introPayment = 0;
                if (introMonthlyRate === 0) {
                    introPayment = loanAmount / totalPayments;
                } else {
                    introPayment = loanAmount * (introMonthlyRate * Math.pow(1 + introMonthlyRate, totalPayments)) / (Math.pow(1 + introMonthlyRate, totalPayments) - 1);
                }

                for (let i = 1; i <= introPayments; i++) {
                    let interestPayment = balance * introMonthlyRate;
                    let principalPayment = introPayment - interestPayment;

                    if (i === totalPayments) { // If intro term covers entire loan
                         principalPayment = balance;
                         introPayment = principalPayment + interestPayment;
                    }

                    balance -= principalPayment;
                    if (balance < 0) balance = 0;
                    totalInterest += interestPayment;

                    schedule.push({
                        period: i,
                        payment: introPayment,
                        principal: principalPayment,
                        interest: interestPayment,
                        balance: balance
                    });
                }

                // Phase 2: SVR Rate Calculation
                let svrPayment = 0;
                if (svrPayments > 0 && balance > 0) {
                    if (svrMonthlyRate === 0) {
                        svrPayment = balance / svrPayments;
                    } else {
                        svrPayment = balance * (svrMonthlyRate * Math.pow(1 + svrMonthlyRate, svrPayments)) / (Math.pow(1 + svrMonthlyRate, svrPayments) - 1);
                    }

                    for (let i = 1; i <= svrPayments; i++) {
                        let interestPayment = balance * svrMonthlyRate;
                        let principalPayment = svrPayment - interestPayment;

                        if (i === svrPayments) {
                            principalPayment = balance;
                            svrPayment = principalPayment + interestPayment;
                        }

                        balance -= principalPayment;
                        if (balance < 0) balance = 0;
                        totalInterest += interestPayment;

                        schedule.push({
                            period: introPayments + i,
                            payment: svrPayment,
                            principal: principalPayment,
                            interest: interestPayment,
                            balance: balance
                        });
                    }
                }

                const locale = 'en-GB';
                const currency = 'GBP';

                let resultsHtml = createResultCard(t('calc-uk-intro-payment'), formatCurrency(introPayment, locale, currency), 'bg-blue-50 border-blue-100 text-blue-900');
                if (svrPayments > 0) {
                    resultsHtml += createResultCard(t('calc-uk-svr-payment'), formatCurrency(svrPayment, locale, currency), 'bg-indigo-50 border-indigo-100 text-indigo-900');
                }
                resultsHtml += createResultCard(t('calc-total-interest'), formatCurrency(totalInterest, locale, currency), 'bg-green-50 border-green-100 text-green-900');

                document.getElementById('results-container').innerHTML = resultsHtml;
                renderAmortization(schedule, locale, currency);
            }
        };

        // State Management & Event Listeners
        function updateTranslations() {
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (i18n[getLang()][key]) {
                    el.textContent = i18n[getLang()][key];
                }
            });
        }

        function updateUI() {
            const mode = document.getElementById('country-selector').value;

            // Toggle form visibility using a more robust method for Tailwind
            document.querySelectorAll('.mode-inputs').forEach(el => {
                el.style.display = 'none';
                el.classList.add('hidden');
            });

            const activeForm = document.getElementById(`inputs-${mode}`);
            if (activeForm) {
                activeForm.style.display = ''; // Reset inline style so Tailwind can manage it
                activeForm.classList.remove('hidden');
            }

            // Trigger calculation for selected mode
            if (Calculators[mode]) {
                Calculators[mode]();
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            // Setup language selector
            const langSelector = document.getElementById('language-selector');
            if (langSelector) {
                // Check local storage for preference
                const savedLang = localStorage.getItem('calc-lang');
                if (savedLang && (savedLang === 'zh-tw' || savedLang === 'en')) {
                    langSelector.value = savedLang;
                }

                langSelector.addEventListener('change', (e) => {
                    localStorage.setItem('calc-lang', e.target.value);
                    updateTranslations();
                    updateUI(); // Re-trigger calculation to update result cards
                });
            }

            // Setup selector change event
            const selector = document.getElementById('country-selector');
            if (selector) {
                selector.addEventListener('change', updateUI);
            }

            // Setup input event listeners for all forms
            document.querySelectorAll('.mode-inputs input').forEach(input => {
                if (input.getAttribute('data-type') === 'currency') {
                    input.addEventListener('input', (e) => {
                        // Preserve cursor position
                        let cursorPosition = e.target.selectionStart;
                        let originalLength = e.target.value.length;

                        // Format value
                        e.target.value = formatNumberWithCommas(e.target.value);

                        // Adjust cursor position based on added/removed commas
                        let newLength = e.target.value.length;
                        cursorPosition = cursorPosition + (newLength - originalLength);
                        e.target.setSelectionRange(cursorPosition, cursorPosition);
                    });
                }

                input.addEventListener('input', () => {
                    const currentMode = document.getElementById('country-selector').value;
                    Calculators[currentMode]();
                });
            });

            // Initial render
            updateTranslations();
            updateUI();
        });
    </script>
</body>
</html>
