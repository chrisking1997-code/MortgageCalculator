                extend: {
                    colors: {
                        primary: '#1e3a8a', /* Dark Blue */
                        secondary: '#10b981', /* Emerald Green */

    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6136031692984392"

</head>
<body class="bg-surface text-gray-800 font-sans antialiased flex h-screen overflow-hidden">

    <!-- Sidebar -->
    <aside id="sidebar" class="bg-white w-64 flex-shrink-0 border-r border-gray-200 flex flex-col transition-transform transform -translate-x-full lg:translate-x-0 fixed inset-y-0 left-0 z-30 lg:static lg:block h-full">
        <div class="p-6 border-b border-gray-200 flex justify-between items-center">
            <h2 class="text-2xl font-bold text-primary">SmartUtilBox</h2>
            <button id="close-sidebar" class="lg:hidden text-gray-500 hover:text-gray-800 focus:outline-none">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </div>
        <div class="p-4 overflow-y-auto flex-grow">
            <div class="mb-6">
                <h3 class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-3" data-i18n="nav-cat-finance">投資與金融</h3>
                <ul class="space-y-2">
                    <li>
                        <a href="/" class="block px-4 py-2 rounded-md hover:bg-gray-50 text-gray-600 transition-colors" data-i18n="nav-mortgage">多國房貸試算中心</a>
                    </li>
                    <li>
                        <a href="/compound" class="block px-4 py-2 rounded-md text-gray-600 hover:bg-gray-50 hover:text-primary transition-colors" data-i18n="nav-compound">複利滾存計算器</a>
                    </li>
                    <li>
                        <a href="/exchange" class="block px-4 py-2 rounded-md text-gray-600 hover:bg-gray-50 hover:text-primary transition-colors" data-i18n="nav-exchange">匯率換算</a>
                    </li>
                    <li>
                        <a href="/coaching" class="block px-4 py-2 rounded-md text-gray-600 hover:bg-gray-50 hover:text-primary transition-colors" data-i18n="nav-coaching">一對一教練服務</a>
                    </li>
                    <li>
                        <a href="/contact" class="block px-4 py-2 rounded-md bg-green-50 text-secondary font-medium" data-i18n="nav-contact">聯繫顧問</a>
                    </li>
                </ul>
            </div>
        </div>
    </aside>

    <!-- Main Content Wrapper -->
    <div class="flex-1 flex flex-col h-full overflow-hidden relative">

        <!-- Top Header -->
        <header class="bg-primary text-white py-4 px-6 shadow-sm flex justify-between items-center z-10 flex-shrink-0">
            <div class="flex items-center">
                <button id="open-sidebar" class="mr-4 lg:hidden text-white focus:outline-none">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
                </button>
                <div class="hidden lg:block">
                    <h1 class="text-xl font-bold" data-i18n="title-contact">寫下您的財務挑戰，獲取專業視角</h1>
                </div>
            </div>
            <div class="flex items-center space-x-4">
                <a href="/blog" class="text-white hover:text-secondary font-medium text-sm lg:text-base" data-i18n="nav-guide">理財專欄</a>
                <select id="language-selector" class="bg-white text-primary text-sm rounded px-2 py-1 border-none focus:ring focus:ring-secondary">
                    <option value="zh-tw">中文</option>
                    <option value="en">English</option>
                </select>
            </div>
        </header>

        <!-- Scrollable Main Content -->
        <main class="flex-1 overflow-y-auto bg-surface">
            <section class="py-12 lg:py-20 px-4 sm:px-6 lg:px-8">
                <div class="max-w-3xl mx-auto bg-white rounded-2xl shadow-sm border border-gray-100 p-6 sm:p-10">
                    <div class="mb-10 text-center">
                        <h1 class="text-3xl font-bold text-primary mb-4" data-i18n="contact-h1">寫下您的財務挑戰，獲取專業視角</h1>
                        <p class="text-gray-600 leading-relaxed text-lg" data-i18n="contact-desc">
                            無論是現金流卡關、對資產配置感到迷惘，還是想了解另類資產的投資邏輯。<br class="hidden sm:block"/>請寫下您目前的狀況，我會親自閱讀並給予回覆。
                        </p>
                    </div>

                    <form id="contact-form" action="https://formspree.io/f/xvzvlvwa" method="POST" class="space-y-6">
                        <div>
                            <label for="name" class="block text-sm font-medium text-gray-700 mb-1" data-i18n="contact-name">姓名 (Name) *</label>
                            <input type="text" id="name" name="name" required class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-secondary focus:border-secondary outline-none transition-shadow" placeholder="王小明">
                        </div>

                        <div>
                            <label for="email" class="block text-sm font-medium text-gray-700 mb-1" data-i18n="contact-email">Email *</label>
                            <input type="email" id="email" name="email" required class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-secondary focus:border-secondary outline-none transition-shadow" placeholder="example@email.com">
                        </div>

                        <div>
                            <label for="occupation" class="block text-sm font-medium text-gray-700 mb-1" data-i18n="contact-occupation">您目前的職業/身份 (可選)</label>
                            <input type="text" id="occupation" name="occupation" class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-secondary focus:border-secondary outline-none transition-shadow" placeholder="例如：軟體工程師、醫師、企業主">
                        </div>

                        <div>
                            <label for="message" class="block text-sm font-medium text-gray-700 mb-1" data-i18n="contact-message">您目前最希望優化的財務目標或遇到的挑戰是什麼？ *</label>
                            <textarea id="message" name="message" rows="5" required class="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-secondary focus:border-secondary outline-none transition-shadow resize-y" placeholder="請盡可能詳細描述您遇到的問題..."></textarea>
                        </div>

                        <div class="pt-4">
                            <button type="submit" class="w-full bg-secondary hover:bg-green-600 text-white font-bold py-4 px-8 rounded-lg shadow-md transition duration-300 transform hover:-translate-y-0.5 text-lg" data-i18n="contact-submit">
                                送出需求評估
                            </button>
                        </div>
                    </form>
                </div>
            </section>

            <!-- Footer inside main content -->
            <footer class="bg-gray-800 text-white py-6 mt-auto flex-shrink-0">
                <div class="container mx-auto px-6 lg:px-8 flex flex-col sm:flex-row justify-between items-center text-sm max-w-5xl">
                    <div class="text-center sm:text-left mb-4 sm:mb-0">
                        <p>&copy; 2026 SmartUtilBox. All rights reserved.</p>
                        <p class="mt-2 text-gray-400" data-i18n="footer-disclaimer">試算結果僅供參考，實際貸款條件以各銀行提供為準。</p>
                    </div>
                    <div class="space-x-4">
                        <a href="/privacy" class="hover:text-gray-300 underline" data-i18n="footer-privacy">隱私權政策</a>
                        <a href="/blog" class="hover:text-gray-300 underline" data-i18n="footer-guide">理財專欄</a>
                    </div>
                </div>
            </footer>
        </main>
    </div>


    <script>
        // Sidebar Toggle Logic
        const sidebar = document.getElementById('sidebar');
        const openSidebarBtn = document.getElementById('open-sidebar');
        const closeSidebarBtn = document.getElementById('close-sidebar');
        const sidebarOverlay = document.getElementById('sidebar-overlay');

        function openSidebar() {
            sidebar.classList.remove('-translate-x-full');
            sidebarOverlay.classList.remove('hidden');
        }

        function closeSidebar() {
            sidebar.classList.add('-translate-x-full');
            sidebarOverlay.classList.add('hidden');
        }

        openSidebarBtn.addEventListener('click', openSidebar);
        closeSidebarBtn.addEventListener('click', closeSidebar);
        sidebarOverlay.addEventListener('click', closeSidebar);


        // i18n Translations
        const i18n = {
            'zh-tw': {
                'title-contact': '寫下您的財務挑戰，獲取專業視角',
                'nav-cat-finance': '投資與金融',
                'nav-mortgage': '多國房貸試算中心',
                'nav-compound': '複利滾存計算器',
                'nav-exchange': '匯率換算',
                'nav-coaching': '一對一教練服務',
                'nav-contact': '聯繫顧問',
                'nav-guide': '理財專欄',
                'footer-disclaimer': '試算結果僅供參考，實際貸款條件以各銀行提供為準。',
                'footer-privacy': '隱私權政策',
                'footer-guide': '理財專欄',
                'contact-h1': '寫下您的財務挑戰，獲取專業視角',
                'contact-desc': '無論是現金流卡關、對資產配置感到迷惘，還是想了解另類資產的投資邏輯。<br class="hidden sm:block"/>請寫下您目前的狀況，我會親自閱讀並給予回覆。',
                'contact-name': '姓名 (Name) *',
                'contact-email': 'Email *',
                'contact-occupation': '您目前的職業/身份 (可選)',
                'contact-message': '您目前最希望優化的財務目標或遇到的挑戰是什麼？ *',
                'contact-submit': '送出需求評估',
                'modal-title': '感謝您的提交',
                'modal-desc': '您的訊息已收到，我將在 48 小時內與您聯繫。',
                'modal-close': '關閉視窗'
            },
            'en': {
                'title-contact': 'Share Your Financial Challenges',
                'nav-cat-finance': 'Investment & Finance',
                'nav-mortgage': 'Multi-Country Mortgage Calculator',
                'nav-compound': 'Compound Interest Calculator',
                'nav-exchange': 'Exchange Rates',
                'nav-coaching': '1-on-1 Coaching',
                'nav-contact': 'Contact Advisor',
                'nav-guide': 'Financial Blog',
                'footer-disclaimer': 'Results are for reference only. Actual terms depend on the bank.',
                'footer-privacy': 'Privacy Policy',
                'footer-guide': 'Financial Blog',
                'contact-h1': 'Share Your Financial Challenges',
                'contact-desc': 'Whether you are stuck with cash flow, confused about asset allocation, or want to understand alternative investments.<br class="hidden sm:block"/>Please describe your current situation, and I will personally read and reply.',
                'contact-name': 'Name *',
                'contact-email': 'Email *',
                'contact-occupation': 'Current Occupation/Identity (Optional)',
                'contact-message': 'What is the core financial goal or challenge you want to optimize? *',
                'contact-submit': 'Submit Needs Assessment',
                'modal-title': 'Thank You for Your Submission',
                'modal-desc': 'Your message has been received, and I will contact you within 48 hours.',
                'modal-close': 'Close Window'
            }
        };

        // Utilities
        function getLang() {
            return document.getElementById('language-selector').value;
        }

        function t(key) {
            return i18n[getLang()][key] || key;
        }

        function updateTranslations() {
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (i18n[getLang()][key]) {
                    if (el.tagName === 'INPUT' && el.type === 'button') {
                        el.value = i18n[getLang()][key];
                    } else if (el.tagName === 'DIV' || el.tagName === 'P' || el.tagName === 'H1') {
                        el.innerHTML = i18n[getLang()][key];
                    } else {
                        el.textContent = i18n[getLang()][key];
                    }
                }
            });

            // Update placeholders
            const lang = getLang();
            if (lang === 'en') {
                document.getElementById('name').placeholder = 'John Doe';
                document.getElementById('email').placeholder = 'example@email.com';
                document.getElementById('occupation').placeholder = 'e.g. Software Engineer, Doctor, Business Owner';
                document.getElementById('message').placeholder = 'Please describe your issue in detail...';
            } else {
                document.getElementById('name').placeholder = '王小明';
                document.getElementById('email').placeholder = 'example@email.com';
                document.getElementById('occupation').placeholder = '例如：軟體工程師、醫師、企業主';
                document.getElementById('message').placeholder = '請盡可能詳細描述您遇到的問題...';
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            // Setup language selector
            const langSelector = document.getElementById('language-selector');
            if (langSelector) {
                const savedLang = localStorage.getItem('calc-lang');
                if (savedLang && (savedLang === 'zh-tw' || savedLang === 'en')) {
                    langSelector.value = savedLang;
                }

                langSelector.addEventListener('change', (e) => {
                    localStorage.setItem('calc-lang', e.target.value);
                    updateTranslations();
                });
            }

            // Auto-fill email from URL parameter
            const urlParams = new URLSearchParams(window.location.search);
            const emailParam = urlParams.get('email');
            if (emailParam) {
                document.getElementById('email').value = emailParam;
            }

            // Initial render
            updateTranslations();
        });
    </script>
</body>
</html>
